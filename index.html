<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تحديد أيام الأسبوع الكونية الفورية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 550px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 1.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 12px;
        }
        .section {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #475569;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #f43f5e;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
            text-align: center;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background-color: #1e293b;
            border-right: 4px solid #38bdf8;
            border-radius: 4px;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 24px;
        }
        .error {
            border-color: #ef4444 !important;
            border-right: 4px solid #ef4444;
            color: #f87171;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .note {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة تحديد يوم الأسبوع الفورية</h2>
    
    <div class="section">
        <label for="targetDate">الرجاء إدخال التاريخ المراد معرفة يومه:</label>
        <!-- الحد الأدنى للتقويم من تاريخ 0500-01-01 -->
        <input type="date" id="targetDate" min="0500-01-01">
        
        <div class="result" id="calcResult">بانتظار اختيار التاريخ...</div>
    </div>

    <div class="note">نطاق عمل الحاسبة: من 01 يناير 500 ميلادية فصاعداً</div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const inputElement = document.getElementById('targetDate');
        const resultElement = document.getElementById('calcResult');

        function findDayOfWeek() {
            // إذا قام المستخدم بمسح الحقل أو عدم اختيار تاريخ
            if (!inputElement.value) {
                resultElement.className = "result";
                resultElement.innerHTML = "بانتظار اختيار التاريخ...";
                return;
            }

            // تقسيم التاريخ لتجنب مشاكل فروق التوقيت (UTC)
            const parts = inputElement.value.split('-');
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);

            // التحقق من اكتمال إدخال السنة المكونة من 3 أو 4 أرقام
            if (isNaN(year) || isNaN(month) || isNaN(day) || parts[0].length < 4) {
                return;
            }

            const selectedDate = new Date(year, month, day);
            selectedDate.setFullYear(year);

            const limitDate = new Date(500, 0, 1);
            limitDate.setFullYear(500);

            // جدار الحماية التاريخي لمنع ما قبل عام 500
            if (selectedDate < limitDate || year < 500) {
                resultElement.className = "result error";
                resultElement.innerHTML = "⚠️ خطأ: الحساب غير ممكن! التاريخ المدخل يقع قبل الحد المسموح به (01 يناير 500 ميلادية).";
                return;
            }

            // مصفوفة أيام الأسبوع باللغة العربية
            const daysOfWeekArabic = [
                "الأحد",
                "الإثنين",
                "الثلاثاء",
                "الأربعاء",
                "الخميس",
                "الجمعة",
                "السبت"
            ];

            const dayIndex = selectedDate.getDay();
            const dayNameArabic = daysOfWeekArabic[dayIndex];

            const formattedDate = selectedDate.toLocaleDateString('ar-DZ', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });

            resultElement.className = "result";
            resultElement.innerHTML = `التاريخ المدخل: <strong>${formattedDate}</strong> يوافق بدقة يوم: <span style="color: #38bdf8; font-weight: bold;">${dayNameArabic}</span>.`;
        }

        // الاستماع لحدث التغيير ليتم الحساب فوراً عند اختيار التاريخ
        inputElement.addEventListener('input', findDayOfWeek);
        inputElement.addEventListener('change', findDayOfWeek);
    });
</script>

</body>
</html>
