<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تحديد أيام الأسبوع الكونية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 550px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 1.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 12px;
        }
        .section {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #475569;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #f43f5e;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
            text-align: center;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.05rem;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background-color: #1e293b;
            border-right: 4px solid #38bdf8;
            border-radius: 4px;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 24px;
        }
        .error {
            border-color: #ef4444 !important;
            border-right: 4px solid #ef4444;
            color: #f87171;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .note {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة تحديد يوم الأسبوع التاريخي</h2>
    
    <div class="section">
        <label for="targetDate">الرجاء إدخال التاريخ المراد معرفة يومه:</label>
        <!-- تحديد الحد الأدنى للتقويم من تاريخ 1500-01-01 -->
        <input type="date" id="targetDate" min="1500-01-01">
        
        <button onclick="findDayOfWeek()">ابحث عن اليوم الموافِق</button>
        
        <div class="result" id="calcResult">بانتظار اختيار التاريخ وضغط زر البحث...</div>
    </div>

    <div class="note">نطاق عمل الحاسبة: من 01 يناير 1500 ميلادية فصاعداً</div>
</div>

<script>
    function findDayOfWeek() {
        const inputElement = document.getElementById('targetDate');
        const resultElement = document.getElementById('calcResult');
        
        // التحقق من وجود إدخال
        if (!inputElement.value) {
            resultElement.className = "result error";
            resultElement.innerHTML = "⚠️ خطأ: يرجى اختيار تاريخ صالح أولاً.";
            return;
        }

        const selectedDate = new Date(inputElement.value);
        // حد الأمان الأدنى (1 يناير 1500)
        const limitDate = new Date(1500, 0, 1); 

        // جدار الحماية التاريخي لمنع ما قبل عام 1500
        if (selectedDate < limitDate) {
            resultElement.className = "result error";
            resultElement.innerHTML = "⚠️ خطأ: الحساب مستحيل وغير ممكن! التاريخ المدخل يقع قبل الحد المسموح به للآلة (01 يناير 1500 ميلادية).";
            return;
        }

        // مصفوفة أيام الأسبوع باللغة العربية كالمطلوب تماماً
        const daysOfWeekArabic = [
            "الأحد",
            "الإثنين",
            "الثلاثاء",
            "الأربعاء",
            "الخميس",
            "الجمعة",
            "السبت"
        ];

        // استخراج رقم اليوم (0 للأحد، 1 للإثنين... إلخ)
        const dayIndex = selectedDate.getDay();
        const dayNameArabic = daysOfWeekArabic[dayIndex];

        // تنسيق التاريخ المدخل لإظهاره بشكل رسمي للمستخدم
        const formattedDate = selectedDate.toLocaleDateString('ar-DZ', { year: 'numeric', month: 'long', day: 'numeric' });

        // عرض النتيجة النهائية بالصياغة الرسمية المتوافقة مع المظهر السابق
        resultElement.className = "result";
        resultElement.innerHTML = `التاريخ المدخل: <strong>${formattedDate}</strong> يوافق بدقة يوم: <span style="color: #38bdf8; font-weight: bold;">${dayNameArabic}</span>.`;
    }
    <!-- Online Visitors & Countries Live Section -->
<section class="z-10 w-full max-w-4xl px-4 my-3">
    <div class="glass-panel p-4 md:p-5 rounded-3xl border border-cyanNeon/30 shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="relative flex h-3.5 w-3.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500"></span>
            </div>
            <div class="flex items-center gap-2">
                <span id="online-users-label" class="text-xs sm:text-sm font-bold text-slate-200">المتصلون أون لاين الآن:</span>
                <span id="online-users-count" class="font-orbitron font-extrabold text-emerald-400 text-base sm:text-lg">1</span>
            </div>
        </div>
        <div id="countries-flags-container" class="flex flex-wrap items-center justify-center gap-2 max-w-full">
            <div class="flex items-center gap-1.5 bg-slate-900/80 px-3 py-1 rounded-xl border border-gold-500/20 text-xs text-gold-300">
                <span>🇩🇿 الجزائر</span>
                <span class="font-orbitron font-bold text-cyanNeon">(1)</span>
            </div>
        </div>
    </div>
</section>

<!-- السكربت الخاص بتشغيل الكود (يتم وضعه مع سكربتات الصفحة) -->
<script>
    async function initOnlinePresence() {
        // 1. تحديد دولة الزائر الحالي تلقائياً عبر IP مجاني
        let userCountry = { code: 'DZ', name: 'الجزائر', flag: '🇩🇿' };
        try {
            const res = await fetch('https://ipapi.co/json/');
            if (res.ok) {
                const data = await res.json();
                if (data && data.country_code && data.country_name) {
                    const flag = data.country_code
                        .toUpperCase()
                        .replace(/./g, char => String.fromCodePoint(127397 + char.charCodeAt()));
                    userCountry = {
                        code: data.country_code,
                        name: data.country_code === 'DZ' ? 'الجزائر' : data.country_name,
                        flag: flag
                    };
                }
            }
        } catch (e) {
            // القيمة الافتراضية في حال عدم الاتصال بـ API
        }

        // 2. مزامنة التبويبات المفتوحة ونشر الدولة (BroadcastChannel)
        const tabId = Math.random().toString(36).slice(2);
        const activeTabs = new Map();
        activeTabs.set(tabId, userCountry);

        function renderOnlineCountries() {
            const counts = {};
            activeTabs.forEach((c) => {
                const key = `${c.flag} ${c.name}`;
                counts[key] = (counts[key] || 0) + 1;
            });

            const countEl = document.getElementById('online-users-count');
            if (countEl) countEl.innerText = activeTabs.size;

            const container = document.getElementById('countries-flags-container');
            if (!container) return;

            container.innerHTML = Object.entries(counts).map(([label, count]) => `
                <div class="flex items-center gap-1.5 bg-slate-900/80 px-3 py-1 rounded-xl border border-gold-500/20 text-xs text-gold-300">
                    <span>${label}</span>
                    <span class="font-orbitron font-bold text-cyanNeon">(${count})</span>
                </div>
            `).join('');
        }

        renderOnlineCountries();

        if ('BroadcastChannel' in window) {
            const channel = new BroadcastChannel('bouhamida_clock_online');
            channel.postMessage({ type: 'ping', id: tabId, country: userCountry });

            channel.onmessage = (event) => {
                const msg = event.data;
                if (msg.type === 'ping') {
                    activeTabs.set(msg.id, msg.country);
                    renderOnlineCountries();
                    channel.postMessage({ type: 'pong', id: tabId, country: userCountry });
                } else if (msg.type === 'pong') {
                    activeTabs.set(msg.id, msg.country);
                    renderOnlineCountries();
                } else if (msg.type === 'bye') {
                    activeTabs.delete(msg.id);
                    renderOnlineCountries();
                }
            };

            window.addEventListener('beforeunload', () => {
                channel.postMessage({ type: 'bye', id: tabId });
            });
        }
    }

    // تشغيل الدالة عند تحميل الصفحة
    initOnlinePresence();

</script>

</body>
</html>
