<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتصلون الآن حسب الدول</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .tracker-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 320px;
            border-top: 4px solid #007bff;
        }
        .tracker-card h3 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: #e7f1ff;
            color: #007bff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 16px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
            max-height: 200px;
            overflow-y: auto;
        }
        li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }
        li:last-child {
            border-bottom: none;
        }
        .count-badge {
            background: #6c757d;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="tracker-card">
        <h3>
            <span>المتصلون الآن</span>
            <span id="total-online" class="badge">0</span>
        </h3>
        <ul id="countries-list">
            <li>جاري التحميل...</li>
        </ul>
    </div>

    <script>
        function fetchOnlineUsers() {
            fetch('get_online_data.php')
                .then(response => response.json())
                .then(data => {
                    // تحديث العدد الإجمالي
                    document.getElementById('total-online').innerText = data.total;

                    // تحديث قائمة الدول
                    let listHTML = '';
                    if (data.countries.length === 0) {
                        listHTML = '<li>لا يوجد متصلون حالياً</li>';
                    } else {
                        data.countries.forEach(item => {
                            listHTML += `
                                <li>
                                    <span>${item.country}</span>
                                    <span class="count-badge">${item.count}</span>
                                </li>
                            `;
                        });
                    }
                    document.getElementById('countries-list').innerHTML = listHTML;
                })
                .catch(error => console.error('خطأ في جلب البيانات:', error));
        }

        // جلب البيانات فور تحميل الصفحة
        fetchOnlineUsers();

        // تحديث البيانات تلقائياً كل 10 ثوانٍ (10000 ميلي ثانية)
        setInterval(fetchOnlineUsers, 10000);
    </script>

</body>
</html>
