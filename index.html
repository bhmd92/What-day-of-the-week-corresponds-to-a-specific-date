<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تحديد أيام الأسبوع الكونية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 550px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 1.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 12px;
        }
        .section {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #475569;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #f43f5e;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
            text-align: center;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.05rem;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background-color: #1e293b;
            border-right: 4px solid #38bdf8;
            border-radius: 4px;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 24px;
        }
        .error {
            border-color: #ef4444 !important;
            border-right: 4px solid #ef4444;
            color: #f87171;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .note {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة تحديد يوم الأسبوع التاريخي</h2>
    
    <div class="section">
        <label for="targetDate">الرجاء إدخال التاريخ المراد معرفة يومه:</label>
        <!-- تحديد الحد الأدنى للتقويم من تاريخ 1500-01-01 -->
        <input type="date" id="targetDate" min="1500-01-01">
        
        <button onclick="findDayOfWeek()">ابحث عن اليوم الموافِق</button>
        
        <div class="result" id="calcResult">بانتظار اختيار التاريخ وضغط زر البحث...</div>
    </div>

    <div class="note">نطاق عمل الحاسبة: من 01 يناير 1500 ميلادية فصاعداً</div>
</div>

<script>
    function findDayOfWeek() {
        const inputElement = document.getElementById('targetDate');
        const resultElement = document.getElementById('calcResult');
        
        // التحقق من وجود إدخال
        if (!inputElement.value) {
            resultElement.className = "result error";
            resultElement.innerHTML = "⚠️ خطأ: يرجى اختيار تاريخ صالح أولاً.";
            return;
        }

        const selectedDate = new Date(inputElement.value);
        // حد الأمان الأدنى (1 يناير 1500)
        const limitDate = new Date(1500, 0, 1); 

        // جدار الحماية التاريخي لمنع ما قبل عام 1500
        if (selectedDate < limitDate) {
            resultElement.className = "result error";
            resultElement.innerHTML = "⚠️ خطأ: الحساب مستحيل وغير ممكن! التاريخ المدخل يقع قبل الحد المسموح به للآلة (01 يناير 1500 ميلادية).";
            return;
        }

        // مصفوفة أيام الأسبوع باللغة العربية كالمطلوب تماماً
        const daysOfWeekArabic = [
            "الأحد",
            "الإثنين",
            "الثلاثاء",
            "الأربعاء",
            "الخميس",
            "الجمعة",
            "السبت"
        ];

        // استخراج رقم اليوم (0 للأحد، 1 للإثنين... إلخ)
        const dayIndex = selectedDate.getDay();
        const dayNameArabic = daysOfWeekArabic[dayIndex];

        // تنسيق التاريخ المدخل لإظهاره بشكل رسمي للمستخدم
        const formattedDate = selectedDate.toLocaleDateString('ar-DZ', { year: 'numeric', month: 'long', day: 'numeric' });

        // عرض النتيجة النهائية بالصياغة الرسمية المتوافقة مع المظهر السابق
        resultElement.className = "result";
        resultElement.innerHTML = `التاريخ المدخل: <strong>${formattedDate}</strong> يوافق بدقة يوم: <span style="color: #38bdf8; font-weight: bold;">${dayNameArabic}</span>.`;
  <!-- قسم عرض المتصلين أونلاين ودولهم -->
<div class="glass-panel p-4 rounded-2xl border border-cyanNeon/30 my-4 text-center w-full max-w-md mx-auto shadow-lg">
    <div class="flex items-center justify-center gap-2 text-cyanNeon font-bold text-sm mb-3">
        <i class="fa-solid fa-users text-gold-400"></i>
        <span>المتصلون الآن: <span id="online-count" class="font-orbitron text-gold-400">0</span></span>
    </div>
    <ul id="countries-list" class="text-xs text-slate-300 space-y-1.5 max-h-32 overflow-y-auto px-2">
        <li class="text-slate-400">جاري تحميل المتصلين ودولهم...</li>
    </ul>
</div>

<!-- مكتبة Firebase لإدارة الاتصال اللحظي -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // إعدادات Firebase الخاصة بك (قم باستبدالها بمعلومات مشروعك المجاني)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
  };

  // تهيئة Firebase
  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();
  const onlineRef = db.ref('site_online_users');

  // جلب دولة الزائر الحالي باستخدام عنوان الـ IP عبر خدمة مجانية
  fetch('https://ipapi.co/json/')
    .then(res => res.json())
    .then(data => {
      const countryName = data.country_name || 'غير معروف';
      const countryCode = data.country_code ? data.country_code.toLowerCase() : '';

      // تسجيل الزائر في قاعدة البيانات
      const userRef = onlineRef.push({
        country: countryName,
        code: countryCode,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      // حذف الزائر فور إغلاقه للصفحة
      userRef.onDisconnect().remove();
    })
    .catch(err => console.error("تعذر جلب الدولة:", err));

  // تحديث قائمة المتصلين والدول بشكل لحظي (Real-time)
  onlineRef.on('value', (snapshot) => {
    const users = snapshot.val();
    const countSpan = document.getElementById('online-count');
    const listUl = document.getElementById('countries-list');
    
    listUl.innerHTML = '';

    if (!users) {
      countSpan.innerText = '0';
      listUl.innerHTML = '<li class="text-slate-400">لا يوجد متصلون حالياً</li>';
      return;
    }

    const userArray = Object.values(users);
    countSpan.innerText = userArray.length;

    // تجميع المتصلين حسب الدولة وعرضهم مع الأعلام
    const countryCounts = {};
    userArray.forEach(user => {
      const key = `${user.country}|${user.code}`;
      countryCounts[key] = (countryCounts[key] || 0) + 1;
    });

    for (const [key, count] of Object.entries(countryCounts)) {
      const [name, code] = key.split('|');
      const flagImg = code ? `<img src="https://flagcdn.com/20x15/${code}.png" class="inline-block ml-1.5 rounded-sm shadow-sm" alt="${name}">` : '🌍 ';
      
      const li = document.createElement('li');
      li.className = 'flex items-center justify-between bg-slate-900/60 px-3 py-1.5 rounded-xl border border-gold-500/10';
      li.innerHTML = `<span class="flex items-center font-medium">${flagImg} ${name}</span> <span class="font-orbitron font-bold text-cyanNeon">${count}</span>`;
      listUl.appendChild(li);
    }
  });
</script>
    }
</script>

</body>
</html>
